<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>內外科護理學實習準備站｜腎臟內科・泌尿道感染・洗腎・化療</title>
<style>:root{
  --bg:#f5f8f9; --card:#ffffff; --ink:#1b2a33; --muted:#5a6b76; --line:#dbe4e8;
  --pri:#0e7490; --pri-d:#0b5a70; --pri-l:#e0f2f7;
  --ok:#15803d; --ok-l:#e3f5ea; --warn:#b45309; --warn-l:#fdf1dc; --bad:#b91c1c; --bad-l:#fde8e8; --crit:#7f1d1d;
  --acc:#7c3aed; --radius:14px; --shadow:0 1px 3px rgba(20,40,50,.08),0 6px 18px rgba(20,40,50,.05);
}
@media (prefers-color-scheme:dark){
  :root{--bg:#10181c; --card:#18232a; --ink:#e6eef2; --muted:#9db0ba; --line:#2a3a43;
   --pri:#38bdd8; --pri-d:#7dd3e8; --pri-l:#12303a; --ok:#4ade80; --ok-l:#12301f; --warn:#fbbf24; --warn-l:#33280e; --bad:#f87171; --bad-l:#3a1717; --crit:#fca5a5; --acc:#c4b5fd;}
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei","Heiti TC",system-ui,sans-serif;font-size:16px;line-height:1.7}
a{color:var(--pri)}
button{font:inherit;cursor:pointer}
h1,h2,h3,h4{line-height:1.35;margin:.2em 0 .5em}
h1{font-size:1.5rem} h2{font-size:1.25rem} h3{font-size:1.1rem} h4{font-size:1rem;color:var(--pri-d);margin-top:1em}

/* layout */
#app{max-width:880px;margin:0 auto;padding:12px 14px 96px}
.topbar{position:sticky;top:0;z-index:20;background:var(--pri);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:10px}
.topbar b{font-size:1.02rem}
.topbar small{opacity:.85}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:4px 2px calc(4px + env(safe-area-inset-bottom))}
.nav button{flex:1;background:none;border:0;padding:6px 2px;color:var(--muted);font-size:.72rem;display:flex;flex-direction:column;align-items:center;gap:1px;border-radius:10px}
.nav button .ic{font-size:1.3rem;line-height:1.2}
.nav button.on{color:var(--pri);font-weight:700;background:var(--pri-l)}
@media(min-width:760px){.nav{position:sticky;top:46px;bottom:auto;border-top:0;border-bottom:1px solid var(--line)} #app{padding-bottom:40px}}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin:12px 0;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grow{flex:1}
.muted{color:var(--muted)} .small{font-size:.88rem}
.btn{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 16px;font-weight:600}
.btn:hover{background:var(--pri-d)}
.btn.ghost{background:transparent;color:var(--pri);border:1px solid var(--pri)}
.btn.sm{padding:5px 11px;font-size:.88rem;border-radius:8px}
.btn.warn{background:var(--warn)} .btn.bad{background:var(--bad)} .btn.ok{background:var(--ok)}
.btn:disabled{opacity:.45;cursor:not-allowed}
input,select,textarea{font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:9px;padding:8px 10px;max-width:100%}
input[type=date]{min-width:9.5em}
label{display:block;font-size:.86rem;color:var(--muted);margin-bottom:2px}
textarea{width:100%;min-height:120px}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.78rem;font-weight:600;background:var(--pri-l);color:var(--pri-d)}
.pill.ok{background:var(--ok-l);color:var(--ok)} .pill.warn{background:var(--warn-l);color:var(--warn)} .pill.bad{background:var(--bad-l);color:var(--bad)}

/* progress */
.bar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--pri);border-radius:99px;transition:width .4s}
.bar.ok>i{background:var(--ok)}

/* journey */
.journey{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.step{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--card);cursor:pointer}
.step:hover{border-color:var(--pri)}
.step .n{font-size:1.5rem}
.step h3{margin:.1em 0}

/* tips */
.tip{background:var(--pri-l);border-left:4px solid var(--pri);padding:9px 12px;border-radius:8px;margin:10px 0;font-size:.95rem}
.tip.warn{background:var(--warn-l);border-color:var(--warn)}
.tip.bad{background:var(--bad-l);border-color:var(--bad)}
.tip.ok{background:var(--ok-l);border-color:var(--ok)}

/* tables */
.tbl{border-collapse:collapse;width:100%;margin:8px 0;font-size:.95rem;display:block;overflow-x:auto}
.tbl th,.tbl td{border:1px solid var(--line);padding:6px 9px;text-align:left;vertical-align:top}
.tbl th{background:var(--pri-l);color:var(--pri-d)}
.tbl.small{font-size:.9rem}
.steps{padding-left:1.3em} .check{list-style:none;padding-left:0} .check li::before{content:"☑ ";color:var(--ok)}
ul,ol{padding-left:1.3em}

/* accordion */
.sec{border:1px solid var(--line);border-radius:12px;margin:10px 0;background:var(--card);overflow:hidden}
.sec>.hd{display:flex;align-items:center;gap:8px;padding:12px 14px;cursor:pointer;font-weight:700}
.sec>.hd .ch{margin-left:auto;transition:transform .2s}
.sec.open>.hd .ch{transform:rotate(90deg)}
.sec>.bd{display:none;padding:2px 16px 14px}
.sec.open>.bd{display:block}
.srcs{font-size:.78rem;color:var(--muted);margin-top:10px;border-top:1px dashed var(--line);padding-top:6px}
.srcs a{margin-right:8px;word-break:break-all}

/* quiz */
.opt{display:block;width:100%;text-align:left;background:var(--card);border:1.5px solid var(--line);border-radius:11px;padding:11px 13px;margin:8px 0;color:var(--ink)}
.opt:hover{border-color:var(--pri)}
.opt.sel{border-color:var(--pri);background:var(--pri-l)}
.opt.right{border-color:var(--ok);background:var(--ok-l)}
.opt.wrong{border-color:var(--bad);background:var(--bad-l)}
.opt:disabled{cursor:default}
.qno{font-size:.85rem;color:var(--muted)}

/* flashcard */
.flash{min-height:190px;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px;border-radius:18px;background:var(--card);border:2px solid var(--pri);font-size:1.15rem;cursor:pointer;box-shadow:var(--shadow);user-select:none}
.flash.back{background:var(--pri-l)}

/* nephron chain */
.chain{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:8px 0}
.chain .seg{background:var(--pri-l);border:2px solid transparent;border-radius:12px;padding:8px 10px;color:var(--pri-d);font-weight:600}
.chain .seg.on{border-color:var(--pri);background:var(--card)}
.chain .ar{color:var(--muted)}

/* lab result */
.res{border-radius:12px;padding:12px 14px;margin-top:10px;border-left:6px solid}
.res.ok{background:var(--ok-l);border-color:var(--ok)} .res.warn{background:var(--warn-l);border-color:var(--warn)}
.res.bad{background:var(--bad-l);border-color:var(--bad)} .res.crit{background:var(--bad-l);border-color:var(--crit)}
.res h4{margin:0 0 4px}
.grid3{display:grid;grid-template-columns:70px repeat(3,1fr);gap:4px;margin:8px 0;font-size:.82rem;text-align:center}
.grid3 div{padding:8px 3px;border-radius:7px}
.g-low{background:#cfeedd;color:#14532d} .g-mod{background:#fdf0b4;color:#713f12} .g-high{background:#fcd5a8;color:#7c2d12} .g-very{background:#f6b4b4;color:#7f1d1d}
.grid3 .hit{outline:3px solid var(--ink);font-weight:800}

/* skills */
.skill{border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0;background:var(--card)}
.skill.done{border-color:var(--ok);background:var(--ok-l)}
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-top:8px}
.stage{border:1px dashed var(--line);border-radius:9px;padding:7px 9px}
.stage.has{border:1px solid var(--ok);background:var(--card)}
.stage .lb{font-size:.78rem;font-weight:700;color:var(--muted)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chip{padding:4px 11px;border-radius:99px;border:1px solid var(--line);background:var(--card);color:var(--ink);font-size:.86rem}
.chip.on{background:var(--pri);color:#fff;border-color:var(--pri)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:60;display:flex;align-items:center;justify-content:center;padding:14px}
.modal>div{background:var(--card);border-radius:16px;max-width:680px;width:100%;max-height:88vh;overflow:auto;padding:18px}

/* toast */
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#1b2a33;color:#fff;padding:8px 16px;border-radius:99px;font-size:.9rem;z-index:80;opacity:0;pointer-events:none;transition:opacity .25s}
#toast.show{opacity:.95}

/* bars compare */
.cmp{display:grid;grid-template-columns:96px 1fr;gap:4px 10px;align-items:center;margin:6px 0;font-size:.9rem}
.cmp .bars{display:flex;flex-direction:column;gap:3px}
.cmp .b{height:14px;border-radius:7px;position:relative;min-width:2px}
.cmp .b.pre{background:#9db0ba} .cmp .b.post{background:var(--ok)}
.cmp .b span{position:absolute;left:100%;margin-left:6px;top:-3px;font-size:.78rem;color:var(--ink);white-space:nowrap}

@media print{
  .topbar,.nav,.noprint,#toast{display:none!important}
  body{background:#fff;color:#000} .card{box-shadow:none;border:1px solid #999;break-inside:avoid}
  #app{max-width:none;padding:0}
}
</style>
</head>
<body>
<div class="topbar"><span style="font-size:1.3rem">🩺</span><div><b>內外科護理學實習準備站</b><br><small>腎臟內科・泌尿道感染・洗腎・化療</small></div></div>
<nav class="nav" id="nav"></nav>
<main id="app"></main>
<div id="toast"></div>
<script>/* ===== 教材內容：腎臟內科／腫瘤化療病人照護 ===== */
const SRC = {
  KDIGO: { t: "KDIGO 2024 Clinical Practice Guideline for CKD", u: "https://kdigo.org/wp-content/uploads/2024/03/KDIGO-2024-CKD-Guideline.pdf" },
  TMUH_PN: { t: "臺北醫學大學附設醫院衛教單張：急性腎盂腎炎", u: "https://www.tmuh.org.tw/UploadFile/HE/M098.pdf" },
  TMUH_UTI: { t: "臺北醫學大學附設醫院衛教單張：泌尿道感染", u: "https://www.tmuh.org.tw/UploadFile/HE/M058.pdf" },
  TMUH_K: { t: "臺北醫學大學附設醫院衛教單張：高血鉀症", u: "https://www.tmuh.org.tw/UploadFile/HE/O078.pdf" },
  TMUH_PD: { t: "臺北醫學大學附設醫院衛教單張：腹膜透析感染腹膜炎", u: "https://www.tmuh.org.tw/UploadFile/HE/M096.pdf" },
  HD01: { t: "國軍左營總醫院：血液透析護理指導", u: "https://806.mnd.gov.tw/at-view/uploads/2022/HD-01.pdf" },
  HD03: { t: "國軍左營總醫院：動靜脈瘻管手術後護理指導", u: "https://806.mnd.gov.tw/at-view/uploads/2022/HD-03動靜脈瘻管手術後護理指導-1.pdf" },
  HD04: { t: "國軍左營總醫院：血液透析病人自體動靜脈瘻管護理指導", u: "https://806.mnd.gov.tw/at-view/uploads/2022/HD-04血液透析病人自體動靜脈瘻管護理指導.pdf" },
  PD02: { t: "國軍左營總醫院：腹膜透析病人的護理指導", u: "https://806.mnd.gov.tw/at-view/uploads/2022/PD-02腹膜透析病人的護理指導.pdf" },
  PD04: { t: "國軍左營總醫院：腹膜透析病人腹膜炎護理指導", u: "https://806.mnd.gov.tw/at-view/uploads/2022/PD-04腹膜透析病人腹膜炎護理指導.pdf" },
  AUH: { t: "亞東紀念醫院：血液透析患者的飲食原則", u: "https://www.auh.org.tw/NewsInfo/HealthEducationInfo?docid=397" },
  NTUH_CBC: { t: "臺大醫院：全血球低下護理指導", u: "https://www.ntuh.gov.tw/ckfinder_file/urology/files/%E5%85%A8%E8%A1%80%E7%90%83%E4%BD%8E%E4%B8%8B%E8%AD%B7%E7%90%86%E6%8C%87%E5%B0%8E.pdf" },
  NTUH_INF: { t: "臺大醫院健康電子報：化學治療後如何預防感染", u: "https://epaper.ntuh.gov.tw/health/201401/pdf/化學治療後如何預防感染.pdf" },
  NTUH_K: { t: "臺大醫院健康電子報：高血鉀的藥物治療（2025）", u: "https://epaper.ntuh.gov.tw/health/202506/PDF/高血鉀的藥物治療.pdf" },
  CMUH: { t: "中國醫藥大學附設醫院：白血球低下", u: "https://www.cmu-hch.cmu.edu.tw/NewsInfo/NewsArticle?no=4272" },
  TZUCHI: { t: "台北慈濟醫院：化學治療後照護注意事項", u: "https://taipei.tzuchi.com.tw/wp-content/uploads/2020/06/ON-E11.pdf" },
  CDC: { t: "疾管署《疫情報導》：嗜中性血球低下病人感染防治措施介紹", u: "https://www.cdc.gov.tw/Uploads/archives/3972c019-0769-4bd2-a73f-4a20d766431a.pdf" },

  LIPP: { t: "Lippincott Nursing Pocket Card：CKD（2024）", u: "https://nursingcenter.com/Clinical-Resources/nursing-pocket-cards/Chronic-Kidney-Disease" },

};

const UNITS = [
/* ------------------------------------------------ 單元1 */
{
  id: "u1", icon: "🫘", title: "1. 腎臟與泌尿道的解剖生理",
  lead: "先搞懂「腎臟平常在做什麼」，之後看到數據異常才會知道為什麼。",
  sections: [
    { h: "泌尿系統的路徑", src: ["TXT", "TMUH_PN"], body: `
      <p>尿液的流向（背起來）：<b>腎臟 → 輸尿管 → 膀胱 → 尿道</b>。</p>
      <p>腎臟內側收集尿液的囊狀空腔叫<b>腎盂</b>，細菌由下往上跑到腎盂造成感染，就是<b>腎盂腎炎</b>（屬於上泌尿道感染）。</p>
      <div class="tip">女性尿道較短（約 3–5 公分），且與陰道、肛門距離近，所以較容易發生泌尿道感染。</div>` },
    { h: "腎元（nephron）：尿液製造工廠", src: ["TXT"], interactive: "nephron", body: `
      <p>每顆腎臟有很多個腎元，是形成尿液的基本單位。<b>點下面的每一段</b>，看它負責什麼。</p>` },
    { h: "尿液怎麼形成？三步驟", src: ["TXT"], body: `
      <ol class="steps">
        <li><b>過濾</b>（腎絲球）：血液中的水、小分子被濾出，大分子（如蛋白質、血球）正常不會被濾出。</li>
        <li><b>再吸收</b>（主要在腎小管）：把身體還需要的水、電解質、葡萄糖等收回血液。</li>
        <li><b>分泌</b>：把多餘的 H⁺、K⁺、藥物等主動送進小管，排出體外。</li>
      </ol>
      <div class="tip warn">想一想：腎絲球受損時，<b>尿中會出現蛋白質或血球</b>，這就是尿液檢查可以看出腎臟問題的原因。</div>` },
    { h: "腎臟的六大工作（腎功能變差會發生什麼）", src: ["TXT", "PD02", "LIPP"], body: `
      <table class="tbl">
        <tr><th>腎臟的工作</th><th>腎功能變差時</th><th>你會在病人身上看到</th></tr>
        <tr><td>排除代謝廢物（尿素氮、肌酸酐）</td><td>廢物堆積（尿毒）</td><td>BUN、Cr 上升；噁心、食慾差、搔癢</td></tr>
        <tr><td>調節水分與鈉</td><td>水分排不出去</td><td>水腫、體重增加、血壓高、呼吸喘</td></tr>
        <tr><td>調節鉀、鈣、磷</td><td>鉀↑、磷↑、鈣↓</td><td>肌肉無力、心律不整；腎性骨病變</td></tr>
        <tr><td>調節酸鹼</td><td>代謝性酸中毒</td><td>呼吸深快、疲倦</td></tr>
        <tr><td>分泌腎素（參與血壓調控，RAAS）</td><td>血壓調控失衡</td><td>高血壓</td></tr>
        <tr><td>分泌紅血球生成素（EPO）、活化維生素 D</td><td>EPO↓、維生素 D 活化不足</td><td>貧血（Hb↓）、骨頭問題</td></tr>
      </table>
      <div class="tip">這張表就是「慢性腎臟病／洗腎病人為什麼會貧血、水腫、骨頭痛」的答案，臨床會一直用到。</div>` },
    { h: "腎臟病人為什麼用藥要特別小心？", src: ["LIPP"], body: `
      <p>腎臟是藥物與廢物的主要出口。GFR 下降時，應注意避免或暫停可能傷腎、或需經腎排除的藥物，例如 <b>NSAIDs（非類固醇消炎止痛藥）</b>、部分利尿劑、metformin 等（KDIGO 2024／Lippincott）。</p>
      <div class="tip warn">實習提醒：病人說「我膝蓋痛自己買止痛藥吃」，一定要<b>問清楚藥名</b>並回報老師／護理師。</div>` }
  ]
},
/* ------------------------------------------------ 單元2 */
{
  id: "u2", icon: "🧪", title: "2. 檢驗數據判讀（互動）",
  lead: "不是背正常值就好，要會回答：「異常代表什麼？我該觀察什麼？要通知誰？」",
  sections: [
    { h: "先講好規則", src: ["TXT"], body: `
      <div class="tip warn"><b>參考值會因醫院檢驗室而不同。</b>本平台的數值為教學用的常見範圍，實習時一律以<b>報告上標示的參考值</b>與<b>單位規定</b>為準。同一個「發燒」，不同單位也有不同定義（例如口溫＞38°C 或耳溫≥37.5°C），先問清楚你單位的規定。</div>` },
    { h: "工具 A：單項數值判讀", src: ["TXT", "TMUH_K", "NTUH_CBC", "NTUH_K"], interactive: "labtool", body: `<p>選一項檢驗、輸入數值，看系統怎麼解讀，並思考護理觀察重點。</p>` },
    { h: "工具 B：慢性腎臟病（CKD）分期", src: ["KDIGO"], interactive: "ckdstage", body: `
      <p>CKD 的定義：腎臟結構或功能異常<b>超過 3 個月</b>。KDIGO 以 <b>G（eGFR）× A（白蛋白尿）</b> 兩個方向分期。</p>` },
    { h: "工具 C：嗜中性白血球絕對值（ANC）", src: ["CDC", "CMUH", "NTUH_CBC"], interactive: "anc", body: `

      <p>KDIGO 2024 的照護方向：治療可逆原因、延緩惡化、處理併發症（高血壓、血糖、減少鹽分攝取、避免腎毒性藥物…）。</p>` },

      <h4>瘻管手臂「六不」</h4>
      <p>不抽血、不打針、不量血壓、不提重物、不壓迫（不當枕頭、不穿過緊衣袖）、不戴首飾手錶。</p>

      <ul>

        <li>常見原因：腎功能不全、攝取過多含鉀食物、便秘、代謝性酸中毒、糖尿病血糖控制差、脫水、細胞破壞（<b>尤其化學治療後</b>、溶血）、部分藥物（ACEI/ARB、保鉀利尿劑等）。</li>

      <div class="tip warn">學生的角色：<b>發現→通報→協助</b>（量生命徵象、準備心電圖、記錄）。給藥與劑量依醫囑，不要自行判斷。</div>` },

      <ul>

        <li>優點：居家執行、血壓較穩定、較保留殘餘腎功能。</li>

      </ul>
      <h4>腹膜炎：第一個警訊是「透析液混濁」</h4>
      <ul>

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const KEY = "nephroEdu.v1";
const defaults = () => ({ profile: { name: "", sid: "", group: "", unit: "" }, quiz: { pre: [], post: [] }, done: {}, known: {}, skills: {}, custom: [], cases: {} });
let MEM_ONLY = false;
function load() { try { const r = localStorage.getItem(KEY); if (r) return Object.assign(defaults(), JSON.parse(r)); } catch (e) { MEM_ONLY = true; } return defaults(); }
let S = load();
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { MEM_ONLY = true; } }
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove("show"), 2200); }
const today = () => { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); };
const shuffle = a => { a = [...a]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pct = (a, b) => b ? Math.round(a * 100 / b) : 0;
function srcLinks(keys) {
  if (!keys || !keys.length) return "";
  return `<div class="srcs">📚 出處：` + keys.map(k => { const s = SRC[k]; if (!s) return ""; return s.u ? `<a href="${esc(s.u)}" target="_blank" rel="noopener">${esc(s.t)}</a>` : `<span>${esc(s.t)}</span>`; }).join("；") + `</div>`;
}

/* ---------- 路由 ---------- */
let VIEW = "home";
function go(v) { VIEW = v; try { if (location.hash.slice(1) !== v) location.hash = v; } catch (e) {} render(); window.scrollTo(0, 0); }
window.addEventListener("hashchange", () => { const v = location.hash.slice(1); if (v && v !== VIEW) { VIEW = v; render(); } });
const NAV = [["home", "🏠", "首頁"], ["learn", "📖", "學習"], ["quiz", "✍️", "測驗"], ["cards", "🧠", "背誦"], ["skills", "✅", "技術"], ["progress", "📊", "成效"], ["help", "❓", "說明"]];
function render() {
  const root = VIEW.startsWith("unit-") ? "learn" : VIEW.startsWith("quiz") ? "quiz" : VIEW;
  $("#nav").innerHTML = NAV.map(([k, ic, t]) => `<button class="${root === k ? "on" : ""}" data-go="${k}"><span class="ic">${ic}</span>${t}</button>`).join("");
  const app = $("#app");
  if (VIEW === "home") app.innerHTML = viewHome();
  else if (VIEW === "learn") app.innerHTML = viewLearn();
  else if (VIEW.startsWith("unit-")) { app.innerHTML = viewUnit(VIEW.slice(5)); mountWidgets(); }
  else if (VIEW === "quiz") app.innerHTML = viewQuizHome();
  else if (VIEW === "quizrun") app.innerHTML = viewQuizRun();
  else if (VIEW === "quizres") app.innerHTML = viewQuizResult();
  else if (VIEW === "cards") { app.innerHTML = viewCards(); }
  else if (VIEW === "skills") app.innerHTML = viewSkills();
  else if (VIEW === "progress") app.innerHTML = viewProgress();
  else if (VIEW === "help") app.innerHTML = viewHelp();
  else app.innerHTML = viewHome();
}

/* ---------- 全域事件 ---------- */
document.addEventListener("click", e => {
  const g = e.target.closest("[data-go]"); if (g) { go(g.dataset.go); return; }
  const a = e.target.closest("[data-act]"); if (a && ACT[a.dataset.act]) { ACT[a.dataset.act](a, e); }
});
document.addEventListener("input", e => { const a = e.target.closest("[data-in]"); if (a && INP[a.dataset.in]) INP[a.dataset.in](a, e); });
document.addEventListener("change", e => { const a = e.target.closest("[data-ch]"); if (a && INP[a.dataset.ch]) INP[a.dataset.ch](a, e); });

}

};
function viewQuizRun() {
  if (!Q) return viewQuizHome();

  const sel = Q.ans[Q.i];
  return `<div class="row noprint"><button class="btn ghost sm" data-act="qquit">離開</button><div class="grow"></div><span class="qno">${Q.m === "pre" ? "課前" : "課後"}測驗 ${Q.i + 1} / ${total}</span></div>

    ${Q.i < total - 1 ? `<button class="btn" data-act="qnext" ${sel === undefined ? "disabled" : ""}>下一題 →</button>` : `<button class="btn ok" data-act="qfinish" ${sel === undefined ? "disabled" : ""}>交卷</button>`}</div>`;
}
ACT.qquit = () => { if (confirm("確定離開？目前作答不會保存。")) { Q = null; go("quiz"); } };
ACT.qpick = el => { Q.ans[Q.i] = +el.dataset.v; render(); };
ACT.qnext = () => { Q.i++; render(); window.scrollTo(0, 0); };
ACT.qprev = () => { Q.i--; render(); };
ACT.qfinish = () => {
  const by = {}; Object.keys(DOMAINS).forEach(d => by[d] = { c: 0, n: 0 });
  let score = 0, unsure = 0;
  Q.list.forEach((q, k) => { const a = Q.ans[k]; by[q.d].n++; if (a === -1) unsure++; else if (a === q.a) { score++; by[q.d].c++; } });
  const rec = { date: today(), score, n: Q.list.length, unsure, by };
  S.quiz[Q.m].push(rec); save();
  Q.rec = rec; Q.done = true; go("quizres");
};
const DOM_UNITS = { A: ["u1"], B: ["u2"], C: ["u3", "u4", "u5"], D: ["u6", "u7"], E: ["u3", "u4", "u5"] };

let C = { deck: "全部", i: 0, flip: false, list: null, mode: "card", only: false };
const cardKey = c => c.g + ":" + c.f.slice(0, 24);
function cardList() {
  let l = CARDS.filter(c => C.deck === "全部" || c.g === C.deck);
  if (C.only) l = l.filter(c => S.known[cardKey(c)] !== 1);
  return l;
}
function viewCards() {
  const decks = ["全部", ...new Set(CARDS.map(c => c.g))];
  const known = Object.keys(S.known).filter(k => S.known[k] === 1).length;
  const l = cardList(); if (C.i >= l.length) C.i = 0;
  const c = l[C.i];
  const head = `<h1>🧠 背誦卡</h1><p class="muted small">先在心裡回答，再點卡片看答案。誠實按「記得了」或「還不熟」，系統會讓你只複習不熟的。已記得 ${known}/${CARDS.length}</p>
  <div class="bar ok"><i style="width:${pct(known, CARDS.length)}%"></i></div>
  <div class="chips">${decks.map(d => `<button class="chip ${C.deck === d ? "on" : ""}" data-act="cdeck" data-d="${d}">${d}</button>`).join("")}</div>
  <div class="row small"><label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" data-ch="conly" ${C.only ? "checked" : ""}> 只看還不熟的</label>
  <button class="btn ghost sm" data-act="cmode">${C.mode === "card" ? "切換成清單（方便列印）" : "切換成卡片"}</button><button class="btn ghost sm" data-act="cshuf">🔀 洗牌</button></div>`;
  if (!l.length) return head + `<div class="card">這個範圍沒有卡片了，太棒了！🎉</div>`;
  if (C.mode === "list") return head + `<table class="tbl small"><tr><th>題目</th><th>答案</th><th>記得</th></tr>` + l.map(x => `<tr><td>${esc(x.f)}</td><td>${esc(x.b)}</td><td>${S.known[cardKey(x)] === 1 ? "✓" : ""}</td></tr>`).join("") + `</table>`;
  return head + `<div class="small muted" style="margin-top:8px">${C.i + 1} / ${l.length}　<span class="pill">${c.g}</span></div>
    <div class="flash ${C.flip ? "back" : ""}" data-act="cflip">${C.flip ? esc(c.b) : "❓ " + esc(c.f)}</div>
    <div class="row" style="margin-top:12px"><button class="btn ghost" data-act="cmove" data-d="-1">←</button>
    <button class="btn bad grow" data-act="cmark" data-v="0">還不熟</button><button class="btn ok grow" data-act="cmark" data-v="1">記得了</button>
    <button class="btn ghost" data-act="cmove" data-d="1">→</button></div>`;
}
ACT.cdeck = el => { C.deck = el.dataset.d; C.i = 0; C.flip = false; render(); };
ACT.cflip = () => { C.flip = !C.flip; render(); };
ACT.cmove = el => { const n = cardList().length; C.i = (C.i + +el.dataset.d + n) % n; C.flip = false; render(); };
ACT.cmark = el => { const c = cardList()[C.i]; S.known[cardKey(c)] = +el.dataset.v; save(); C.flip = false; const n = cardList().length; if (C.only && el.dataset.v === "1") { if (C.i >= n - 1) C.i = 0; } else C.i = (C.i + 1) % Math.max(n, 1); render(); };
ACT.cmode = () => { C.mode = C.mode === "card" ? "list" : "card"; render(); };
ACT.cshuf = () => { CARDS.sort(() => Math.random() - 0.5); C.i = 0; C.flip = false; render(); };

/* ===== 共用：文字匯出視窗 ===== */
async function tryDownload(filename, text, mime) {
  try { if (window.claude && claude.use) { const d = await claude.use("downloads"); if (d) { await d.save({ filename, data: new Blob([text], { type: mime }) }); return true; } } } catch (e) { if (e && e.code === "declined") return true; }
  try { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text], { type: mime })); a.download = filename; document.body.appendChild(a); a.click(); a.remove(); return true; } catch (e) { return false; }
}
function showText(title, text, filename, mime) {
  const m = document.createElement("div"); m.className = "modal";
  m.innerHTML = `<div><h3>${esc(title)}</h3><textarea readonly id="mtxt">${esc(text)}</textarea><div class="row" style="margin-top:10px"><button class="btn" id="mcopy">📋 複製</button>${filename ? '<button class="btn ghost" id="mdl">⬇️ 下載檔案</button>' : ""}<div class="grow"></div><button class="btn ghost" id="mclose">關閉</button></div><div class="small muted">若下載被瀏覽器擋下，請用「複製」後貼到記事本／Excel 或寄給老師。</div></div>`;
  document.body.appendChild(m);
  m.addEventListener("click", async e => {
    if (e.target === m || e.target.id === "mclose") m.remove();
    else if (e.target.id === "mcopy") { const t = $("#mtxt", m); try { await navigator.clipboard.writeText(t.value); toast("已複製"); } catch (er) { t.select(); try { document.execCommand("copy"); toast("已複製"); } catch (e2) { toast("請長按選取後複製"); } } }
    else if (e.target.id === "mdl") { const ok = await tryDownload(filename, text, mime || "text/plain"); toast(ok ? "已送出下載" : "下載失敗，請改用複製"); }
  });
}

      ["✅ 技術", `共 ${nSk} 項（另可自行新增）。每項有三個階段：<b>① 老師教授 → ② 操作一半 → ③ 完全操作</b>。完成時按「今天」或選日期，並請臨床老師在「簽名／備註」欄簽名或寫評語。`, "上方可依類別或進度篩選。日期順序不合時會提醒（日期仍會存），請確認有沒有填錯。可「匯出 CSV」或「列印」。"],

    ])}
  </div>
  <div class="card">
    <h3>實習期間與最後一週</h3>
    ${helpTable(["時間", "你要做的事"], [
      ["實習前", "完成課前測驗；看建議複習的單元；每天背卡片。"],
      ["實習期間", "遇到病人的情況，回來查對應單元；每學會一項技術，<b>當天</b>填日期，並請老師簽名或寫評語。"],
      ["實習最後一週", "做課後測驗；到「成效」看前後比較；產生進度碼，<b>依老師指示繳交</b>。"]
    ])}
    <div class="tip small">課前測驗可以再做，但<b>平台的班級總表以第一次課前成績</b>為準；課後則取<b>最近一次</b>。</div>
  </div>
  <div class="card">
    <h3>備份、換手機、繳交</h3>
    ${helpSteps([
      "到「成效」→「備份與繳交」→ 按「產生進度碼」。",
      "<b>整串複製</b>（包含最前面的 <code>NEPH1:</code>），貼到自己的備忘錄，或傳給老師。也可按「下載檔案」存成文字檔。",
      "換手機或進度不見時：同一頁按「貼上進度碼還原」，貼上後按「還原」。<b>還原會覆蓋那台裝置現有的進度</b>。",
      "需要給老師看文字版時，按「產生文字摘要」。"
    ])}
    <div class="tip warn small">進度碼含你的姓名與學號，只傳給老師，不要貼在公開群組。</div>
  </div>
  <div class="card">
    <h3>常見問題</h3>
    ${helpTable(["情況", "處理方式"], [
      ["進度不見了", "可能換了瀏覽器或裝置、用了無痕模式、或清除過瀏覽資料。有進度碼就用「貼上進度碼還原」。"],
      ["下載按鈕沒反應", "改按「複製」，貼到記事本、Excel 或訊息軟體。"],
      ["首頁出現「無法保存進度」", "此瀏覽器擋住儲存功能。請改用一般（非無痕）模式，並更常複製進度碼自行保存。"],
      ["不確定某個數值或做法", "本平台是教學輔助。臨床上一律以<b>醫囑、單位護理常規與臨床老師指導</b>為準；檢驗參考值以各院報告為準。"]
    ])}
  </div>` + printBtn;

  return head + `
  <div class="card">
    <h2>👩‍🏫 老師操作指引</h2>
    <div class="tip small"><b>先了解這個平台的運作方式</b><br>• 純網頁，沒有帳號系統，也不會自動回傳資料。每位學生的資料只在<b>自己的瀏覽器</b>。<br>• 你看不到學生的即時進度，需要學生提供<b>進度碼</b>（或文字摘要、技術清單 CSV）。<br>• 彙整時資料只在你的瀏覽器處理，不會上傳。</div>
  </div>
  <div class="card">
    <h3>發給學生之前</h3>
    ${helpSteps([
      "把平台網址提供給學生。手機、電腦的瀏覽器都能開，不需註冊。",
      "請學生在「首頁」填姓名、學號、組別。<b>組別欄是自由輸入</b>，建議先統一寫法（例：A2 腎臟內科）。",
      "自己先從頭走一遍，確認單元、題目與技術項目符合單位需求。你的操作資料會存在你自己的瀏覽器，可到「成效」頁底部清除。"
    ])}
  </div>
  <div class="card">
    <h3>建議的使用時程</h3>
    ${helpTable(["時間", "學生做", "老師做"], [
      ["實習前", "課前測驗（" + PRE.length + " 題）、看單元、背誦卡", "（選用）請學生傳課前進度碼，用班級總表看各領域起點，決定課前講解重點。"],
      ["實習期間", "技術清單填日期", "學生完成某階段時，請學生打開該技術，在「臨床老師簽名／備註」欄輸入你的簽名或評語。"],
      ["實習最後", "課後測驗、產生進度碼", "收齊進度碼，產生班級總表，看前後測進步與技術完成度。"]
    ])}
    <div class="tip warn small"><b>簽名的限制：</b>平台沒有老師登入機制，簽名欄是學生裝置上輸入的文字，<b>無法驗證真偽</b>。需要正式簽核時，請仍以單位的正式評核表為準，可請學生匯出技術清單 CSV 供核對。</div>
  </div>
  <div class="card">
    <h3>彙整全班資料（步驟）</h3>
    ${helpSteps([
      "請每位學生：「成效」→「產生進度碼」→ 整串複製（含 <code>NEPH1:</code>）→ 傳給你（LINE、Email 皆可）。",
      "你打開「成效」頁，往下找到「<b>教師彙整</b>」。",
      "把進度碼貼進文字框，<b>一行一位學生</b>。",
      "按「產生班級總表」。",
      "需要存檔時，按「匯出此表 CSV」，下載或複製後貼到 Excel。"
    ])}
    <p class="small"><button class="btn sm" data-go="progress">前往成效頁</button></p>
    <h4>總表內容</h4>
    <ul class="small">
      <li>每位學生：姓名、學號、組別、課前％、課後％、進步幅度、單元完成數、技術三個階段各完成幾項。</li>
      <li>最後一列為平均；下方另有<b>各領域的全班正確率</b>（課前、課後）。</li>
      <li>課前取學生<b>第一次</b>的成績，課後取<b>最近一次</b>。</li>
      <li>某一行讀不到時會顯示「第 N 行無法讀取」，請該生確認整串完整複製後重傳。</li>
    </ul>
    <div class="tip small"><b>總表沒有的資料：</b>每項技術的日期與簽名備註、個案模擬的成績不在總表內。要看技術明細，請學生在「技術」頁按「匯出 CSV」；要看個案模擬，請學生按「產生文字摘要」。技術總項數會把學生自行新增的項目也算進去，所以分母可能因人而異。</div>
  </div>
  <div class="card">
    <h3>隱私與限制</h3>
    <ul class="small">
      <li><b>進度碼不是加密</b>，只是把資料轉成文字，可被還原出姓名、學號與全部作答紀錄。請用私訊或 Email 收，不要公開張貼。</li>
      <li>沒有雲端備份。學生若換裝置或清除資料又沒有進度碼，進度無法找回。</li>
      <li>學習內容、題目與技術的「評核重點」是教學輔助版本，採用前請老師審閱。部分數值與做法各院規定不同（例如檢驗參考值、發燒定義、瘻管使用時機、肢體抬高高度），以單位規定為準。</li>
      <li>單元、題目與技術清單無法在網頁內編輯，增修需改動內容後重新發布。學生可自行新增「自訂技術」，但只存在該生的裝置。</li>
    </ul>
  </div>` + printBtn;
}
ACT.helptab = el => { HELP.tab = el.dataset.t; render(); };
ACT.helpopen = el => { HELP.tab = el.dataset.t; go("help"); };

(function init(){
  const v = (location.hash||"").slice(1);
  if (["home","learn","quiz","cards","skills","progress","help"].includes(v) || /^unit-u\d+$/.test(v)) VIEW = v;
  render();
})();
</script>
</body>
</html>
